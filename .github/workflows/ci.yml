name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        # ruff is PINNED on purpose. `pip install ruff` takes the newest release,
        # so a formatter release turns every open PR in this repo red without a
        # commit touching any code — 0.16.x began formatting python blocks inside
        # markdown, which reddened this repo on a docs/ plan file. Bump
        # deliberately, with the reformat in the same commit.
        run: pip install pytest 'ruff==0.16.6'

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest
